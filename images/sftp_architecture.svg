<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="vpsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="950" height="580" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="900" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">KIẾN TRÚC TRUYỀN DỮ LIỆU SFTP VÀ PHÂN QUYỀN NGƯỜI DÙNG GIỚI HẠN</text>
  <text x="475" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">SSH File Transfer Protocol (Port 22) • Windows Client • Least Privilege Security</text>

  <g transform="translate(40, 105)">
    <rect width="250" height="340" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="250" height="42" rx="12" fill="url(#winGrad)"/>
    <text x="125" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">WINDOWS CLIENT (LOCAL)</text>

    <g transform="translate(15, 60)">
      <rect width="220" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="110" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Phần mềm SFTP Client</text>
      <text x="110" y="44" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Bitvise SSH / WinSCP</text>
      <text x="110" y="58" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Port 22 • Protocol SFTP</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="220" height="85" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="110" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Thông tin xác thực (Auth)</text>
      <text x="110" y="44" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Host: VPS_IP:22</text>
      <text x="110" y="60" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">User: sftp-user</text>
      <text x="110" y="76" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">Auth: Password-based</text>
    </g>

    <g transform="translate(15, 240)">
      <rect width="220" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <text x="110" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Thư mục tải về cục bộ</text>
      <text x="110" y="44" font-family="monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">C:\Users\Admin\Downloads\</text>
      <text x="110" y="64" font-family="monospace" font-size="10.5" fill="#34d399" text-anchor="middle">backup-check.log (OK)</text>
    </g>
  </g>

  <g transform="translate(320, 105)">
    <rect width="280" height="340" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="280" height="42" rx="12" fill="url(#sshGrad)"/>
    <text x="140" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ĐƯỜNG TRUYỀN MÃ HÓA SFTP</text>

    <g transform="translate(15, 55)">
      <rect width="250" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="125" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Giao thức SSHv2 (Port 22)</text>
      <text x="125" y="44" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Mã hóa AES-256-GCM</text>
      <text x="125" y="60" font-family="sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Chống nghe lén (No Sniffing)</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="250" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="125" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">So sánh SFTP vs FTP thông thường</text>
      <text x="125" y="44" font-family="sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">FTP (Port 21): Plaintext nguy hiểm</text>
      <text x="125" y="64" font-family="sans-serif" font-size="10.5" fill="#34d399" text-anchor="middle">SFTP (Port 22): Bảo mật nhị phân</text>
    </g>

    <g transform="translate(15, 240)">
      <rect width="250" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="125" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Luồng truyền nhận tệp</text>
      <text x="125" y="44" font-family="sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Download: Remote -> Local</text>
      <text x="125" y="64" font-family="monospace" font-size="10.5" fill="#34d399" text-anchor="middle">Kiểm tra toàn vẹn Checksum</text>
    </g>
  </g>

  <g transform="translate(630, 105)">
    <rect width="280" height="340" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="280" height="42" rx="12" fill="url(#vpsGrad)"/>
    <text x="140" y="27" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MÁY CHỦ LINUX (REMOTE VPS)</text>

    <g transform="translate(15, 55)">
      <rect width="250" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <text x="125" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Tài khoản sftp-user</text>
      <text x="125" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">uid=1003(sftp-user)</text>
      <text x="125" y="58" font-family="sans-serif" font-size="10.5" fill="#f87171" text-anchor="middle">KHÔNG thuộc nhóm sudo (No Root)</text>
      <text x="125" y="72" font-family="sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Nguyên tắc đặc quyền tối thiểu</text>
    </g>

    <g transform="translate(15, 145)">
      <rect width="250" height="80" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="125" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Thư mục /var/log/app-backup/</text>
      <text x="125" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Chủ sở hữu: root:sftp-user</text>
      <text x="125" y="60" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">chmod 750 (drwxr-x---)</text>
      <text x="125" y="74" font-family="sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">sftp-user có quyền r-x (vào thư mục)</text>
    </g>

    <g transform="translate(15, 235)">
      <rect width="250" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="125" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Tệp backup-check.log</text>
      <text x="125" y="42" font-family="monospace" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Chủ sở hữu: root:sftp-user</text>
      <text x="125" y="60" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">chmod 640 (-rw-r-----)</text>
      <text x="125" y="74" font-family="sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">sftp-user chỉ có quyền đọc (r--)</text>
    </g>
  </g>

  <path d="M 290 275 L 320 275" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 600 275 L 630 275" stroke="#10b981" stroke-width="2.5" fill="none"/>

  <rect x="40" y="470" width="870" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="60" y="495" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">NGUYÊN TẮC BẢO MẬT SFTP TRONG DEVOPS THỰC TẾ:</text>
  <text x="60" y="517" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Tuyệt đối không dùng tài khoản root hoặc tài khoản có quyền sudo để truyền file qua giao diện đồ họa.</text>
  <text x="60" y="537" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Tạo user giới hạn (sftp-user), gán vào group sở hữu tệp log với quyền đọc tối thiểu (chmod 640), ngăn chặn ghi đè hoặc can thiệp trái phép.</text>
</svg>
