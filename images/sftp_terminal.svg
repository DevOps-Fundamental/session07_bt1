<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 640" width="100%" height="100%">
  <defs>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="950" height="640" rx="14" fill="#0f172a"/>

  <g filter="url(#winShadow)">
    <rect x="25" y="25" width="900" height="590" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <rect x="25" y="25" width="900" height="38" rx="10" fill="url(#termHeader)"/>
    
    <circle cx="48" cy="44" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="68" cy="44" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="88" cy="44" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <text x="475" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="600" fill="#c9d1d9" text-anchor="middle">admin@ubuntu-vps: ~ • SFTP User &amp; Permission Verification</text>

    <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12">
      <!-- Step 1: id sftp-user -->
      <text x="45" y="90" fill="#58a6ff" font-weight="600">admin@ubuntu-vps:~$</text>
      <text x="220" y="90" fill="#f0f6fc">id sftp-user</text>
      <text x="45" y="112" fill="#3fb950">uid=1003(sftp-user) gid=1003(sftp-user) groups=1003(sftp-user)</text>
      <text x="45" y="132" fill="#8b949e">[Xác nhận: User không thuộc nhóm sudo hay adm, không có quyền root]</text>

      <!-- Step 2: ls -ld /var/log/app-backup -->
      <text x="45" y="165" fill="#58a6ff" font-weight="600">admin@ubuntu-vps:~$</text>
      <text x="220" y="165" fill="#f0f6fc">ls -ld /var/log/app-backup</text>
      <text x="45" y="187" fill="#79c0ff">drwxr-x--- 2 root sftp-user 4096 Oct  7 18:55 /var/log/app-backup</text>

      <!-- Step 3: ls -l /var/log/app-backup/backup-check.log -->
      <text x="45" y="220" fill="#58a6ff" font-weight="600">admin@ubuntu-vps:~$</text>
      <text x="220" y="220" fill="#f0f6fc">ls -l /var/log/app-backup/backup-check.log</text>
      <text x="45" y="242" fill="#79c0ff">-rw-r----- 1 root sftp-user 184 Oct  7 18:55 /var/log/app-backup/backup-check.log</text>

      <!-- Step 4: cat log -->
      <text x="45" y="275" fill="#58a6ff" font-weight="600">admin@ubuntu-vps:~$</text>
      <text x="220" y="275" fill="#f0f6fc">cat /var/log/app-backup/backup-check.log</text>
      <text x="45" y="297" fill="#cbd5e1">Backup status: SUCCESS at Wed Oct  7 18:55:00 UTC 2026</text>
      <text x="45" y="315" fill="#cbd5e1">Service: database-backup-daemon</text>
      <text x="45" y="333" fill="#cbd5e1">Size: 42.5 MB</text>
      <text x="45" y="351" fill="#cbd5e1">Integrity checksum: 8f9b7c1e3a4d6f5e</text>
      <text x="45" y="369" fill="#3fb950">Result: ALL TASKS COMPLETED SUCCESSFULLY</text>

      <!-- Step 5: Test sftp-user read permission -->
      <text x="45" y="405" fill="#58a6ff" font-weight="600">admin@ubuntu-vps:~$</text>
      <text x="220" y="405" fill="#f0f6fc">sudo -u sftp-user cat /var/log/app-backup/backup-check.log | head -n 1</text>
      <text x="45" y="427" fill="#3fb950">Backup status: SUCCESS at Wed Oct  7 18:55:00 UTC 2026</text>

      <!-- Step 6: Test sftp-user write denial -->
      <text x="45" y="460" fill="#58a6ff" font-weight="600">admin@ubuntu-vps:~$</text>
      <text x="220" y="460" fill="#f0f6fc">sudo -u sftp-user touch /var/log/app-backup/tamper.txt</text>
      <text x="45" y="482" fill="#f85149">touch: cannot touch '/var/log/app-backup/tamper.txt': Permission denied</text>
      <text x="45" y="502" fill="#8b949e">[Xác nhận: sftp-user chỉ có quyền đọc (r), bị chặn hoàn toàn quyền ghi (w)]</text>

      <!-- Step 7: Test sftp-user sudo denial -->
      <text x="45" y="535" fill="#58a6ff" font-weight="600">admin@ubuntu-vps:~$</text>
      <text x="220" y="535" fill="#f0f6fc">sudo -u sftp-user sudo -l</text>
      <text x="45" y="557" fill="#f85149">[sudo] password for sftp-user: </text>
      <text x="45" y="575" fill="#f85149">sftp-user is not in the sudoers file. This incident will be reported.</text>
    </g>
  </g>
</svg>
